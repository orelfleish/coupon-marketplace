<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coupon Marketplace</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; color: #333; }
    header { background: #2c3e50; color: white; padding: 16px 32px; display: flex; align-items: center; gap: 24px; }
    header h1 { font-size: 20px; }
    nav button { background: none; border: 1px solid white; color: white; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; }
    nav button.active { background: white; color: #2c3e50; }
    .page { display: none; padding: 32px; max-width: 900px; margin: 0 auto; }
    .page.active { display: block; }
    h2 { margin-bottom: 20px; font-size: 18px; }
    .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: #666; }
    input, select { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    .btn { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .btn-primary { background: #2c3e50; color: white; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-success { background: #27ae60; color: white; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .coupon-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .coupon-card img { width: 100%; height: 140px; object-fit: cover; }
    .coupon-card .info { padding: 12px; }
    .coupon-card .name { font-weight: 600; margin-bottom: 4px; }
    .coupon-card .price { color: #27ae60; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .coupon-card .desc { font-size: 12px; color: #888; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #f0f0f0; padding: 10px; text-align: left; }
    td { padding: 10px; border-bottom: 1px solid #eee; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; }
    .badge-sold { background: #fde8e8; color: #e74c3c; }
    .badge-available { background: #e8f8ee; color: #27ae60; }
    .alert { padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; font-size: 14px; }
    .alert-success { background: #e8f8ee; color: #27ae60; }
    .alert-error { background: #fde8e8; color: #e74c3c; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; border-radius: 8px; padding: 24px; max-width: 400px; width: 90%; }
    .modal h3 { margin-bottom: 12px; }
    .value-box { background: #f0f8ff; border: 2px dashed #3498db; border-radius: 6px; padding: 16px; text-align: center; font-size: 20px; font-weight: 700; color: #2c3e50; letter-spacing: 2px; margin: 12px 0; }
    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }
  </style>
</head>
<body>

<header>
  <h1>🎟️ Coupon Marketplace</h1>
  <nav>
    <button class="active" onclick="showPage('customer')">Customer</button>
    <button onclick="showPage('admin')">Admin</button>
  </nav>
</header>

<!-- CUSTOMER PAGE -->
<div id="customer" class="page active">
  <h2>Available Coupons</h2>
  <div id="customer-alert"></div>
  <div id="coupon-grid" class="grid">
    <p>Loading...</p>
  </div>
</div>

<!-- ADMIN PAGE -->
<div id="admin" class="page">
  <div class="card">
    <h2>Create Coupon</h2>
    <br/>
    <div id="admin-alert"></div>
    <div class="row">
      <div class="form-group">
        <label>Name</label>
        <input id="name" placeholder="Amazon $100 Coupon" />
      </div>
      <div class="form-group">
        <label>Image URL</label>
        <input id="image_url" placeholder="https://..." />
      </div>
    </div>
    <div class="form-group">
      <label>Description</label>
      <input id="description" placeholder="Optional description" />
    </div>
    <div class="row">
      <div class="form-group">
        <label>Cost Price</label>
        <input id="cost_price" type="number" placeholder="80" />
      </div>
      <div class="form-group">
        <label>Margin %</label>
        <input id="margin_percentage" type="number" placeholder="25" />
      </div>
    </div>
    <div class="row">
      <div class="form-group">
        <label>Value Type</label>
        <select id="value_type">
          <option value="STRING">STRING</option>
          <option value="IMAGE">IMAGE</option>
        </select>
      </div>
      <div class="form-group">
        <label>Coupon Value (barcode/code)</label>
        <input id="value" placeholder="AMZN-1234-ABCD" />
      </div>
    </div>
    <button class="btn btn-primary" onclick="createCoupon()">Create Coupon</button>
  </div>

  <div class="card">
    <h2>All Coupons</h2>
    <br/>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Cost</th>
          <th>Margin</th>
          <th>Min Price</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="admin-table">
        <tr><td colspan="6">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Purchase Modal -->
<div id="modal" class="modal-overlay">
  <div class="modal">
    <h3>🎉 Purchase Successful!</h3>
    <p>Your coupon code:</p>
    <div class="value-box" id="modal-value"></div>
    <p style="font-size:12px;color:#888;margin-bottom:16px">Keep this code safe — it can only be revealed once.</p>
    <button class="btn btn-primary" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
  const API = 'http://localhost:3000/api/v1';

  // ─── Navigation ───────────────────────────────────────
  function showPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById(page).classList.add('active');
    event.target.classList.add('active');
    if (page === 'customer') loadCustomerProducts();
    if (page === 'admin') loadAdminProducts();
  }

  // ─── Customer ─────────────────────────────────────────
  async function loadCustomerProducts() {
    const grid = document.getElementById('coupon-grid');
    try {
      const res = await fetch(`${API}/customer/products`);
      const products = await res.json();
      if (!products.length) {
        grid.innerHTML = '<p>No coupons available right now.</p>';
        return;
      }
      grid.innerHTML = products.map(p => `
        <div class="coupon-card">
          <img src="${p.image_url}" onerror="this.src='https://picsum.photos/200'" />
          <div class="info">
            <div class="name">${p.name}</div>
            <div class="price">$${p.price}</div>
            <div class="desc">${p.description || ''}</div>
            <button class="btn btn-success" style="width:100%" onclick="customerPurchase('${p.id}')">Buy Now</button>
          </div>
        </div>
      `).join('');
    } catch {
      grid.innerHTML = '<p>Failed to load coupons.</p>';
    }
  }

  async function customerPurchase(productId) {
    try {
      const res = await fetch(`${API}/customer/products/${productId}/purchase`, { method: 'POST' });
      const data = await res.json();
      if (!res.ok) {
        showAlert('customer-alert', data.message, 'error');
        return;
      }
      document.getElementById('modal-value').textContent = data.value;
      document.getElementById('modal').classList.add('active');
      loadCustomerProducts();
    } catch {
      showAlert('customer-alert', 'Purchase failed', 'error');
    }
  }

  // ─── Admin ────────────────────────────────────────────
  async function loadAdminProducts() {
    const tbody = document.getElementById('admin-table');
    try {
      const res = await fetch(`${API}/admin/products`, {
        headers: { 'x-admin-key': 'admin_secret_123' }
      });
      const products = await res.json();
      if (!products.length) {
        tbody.innerHTML = '<tr><td colspan="6">No coupons yet.</td></tr>';
        return;
      }
      tbody.innerHTML = products.map(p => `
        <tr>
          <td>${p.name}</td>
          <td>$${p.coupon.cost_price}</td>
          <td>${p.coupon.margin_percentage}%</td>
          <td>$${p.coupon.minimum_sell_price}</td>
          <td><span class="badge ${p.coupon.is_sold ? 'badge-sold' : 'badge-available'}">
            ${p.coupon.is_sold ? 'Sold' : 'Available'}
          </span></td>
          <td><button class="btn btn-danger" onclick="deleteCoupon('${p.id}')">Delete</button></td>
        </tr>
      `).join('');
    } catch {
      tbody.innerHTML = '<tr><td colspan="6">Failed to load.</td></tr>';
    }
  }

  async function createCoupon() {
    const body = {
      name: document.getElementById('name').value,
      description: document.getElementById('description').value,
      image_url: document.getElementById('image_url').value,
      cost_price: Number(document.getElementById('cost_price').value),
      margin_percentage: Number(document.getElementById('margin_percentage').value),
      value_type: document.getElementById('value_type').value,
      value: document.getElementById('value').value,
    };

    try {
      const res = await fetch(`${API}/admin/products`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-key': 'admin_secret_123' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) {
        showAlert('admin-alert', data.message, 'error');
        return;
      }
      showAlert('admin-alert', `Coupon created! Min price: $${data.coupon.minimum_sell_price}`, 'success');
      loadAdminProducts();
    } catch {
      showAlert('admin-alert', 'Failed to create coupon', 'error');
    }
  }

  async function deleteCoupon(id) {
    if (!confirm('Delete this coupon?')) return;
    try {
      await fetch(`${API}/admin/products/${id}`, {
        method: 'DELETE',
        headers: { 'x-admin-key': 'admin_secret_123' }
      });
      loadAdminProducts();
    } catch {
      alert('Failed to delete');
    }
  }

  // ─── Helpers ──────────────────────────────────────────
  function showAlert(id, message, type) {
    const el = document.getElementById(id);
    el.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    setTimeout(() => el.innerHTML = '', 4000);
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('active');
  }

  // Load customer products on start
  loadCustomerProducts();
</script>
</body>
</html>
