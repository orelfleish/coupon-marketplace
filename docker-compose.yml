services:
  app:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mongodb://mongo:27017/coupon_marketplace?replicaSet=rs0&directConnection=true
      PORT: 3000
      JWT_SECRET: super_secret_key_change_this_in_production
      ADMIN_API_KEY: admin_secret_123
      RESELLER_SECRET: reseller_secret_123
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules

  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command: >
      mongosh --host mongo:27017 --eval
      'rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]})'

volumes:
  mongo_data: